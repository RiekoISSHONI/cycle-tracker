<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #FAF8F5; }
    a { color: #C47E8E; } a:hover { color: #3B3335; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF8F5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.10);">

  <!-- Status bar -->
  <div style="height: 56px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 15px; font-weight: 600; color: #3B3335;">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#3B3335"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13" y="3" width="3" height="9" rx="1" fill="#B8ADB1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#3B3335" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#3B3335"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#3B3335"/></svg>
    </div>
  </div>

  <!-- Back -->
  <div style="padding: 4px 28px 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A7E82" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span style="font-size: 14px; color: #8A7E82; font-weight: 500;">Back</span>
  </div>

  <!-- Title -->
  <div style="padding: 24px 28px 0;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 26px; font-weight: 600; color: #3B3335;">お支払い</div>
    <div style="font-size: 13px; color: #8A7E82; font-weight: 500; margin-top: 4px;">Payment</div>
  </div>

  <!-- Order summary -->
  <div style="margin: 22px 28px 0; padding: 18px 20px; border-radius: 16px; background: #fff; border: 1px solid rgba(59,51,53,0.06);">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">Order Summary</div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(59,51,53,0.05);">
      <div>
        <div style="font-size: 14px; font-weight: 600; color: #3B3335;">Meguri Premium</div>
        <div style="font-size: 12px; color: #8A7E82; margin-top: 2px;">Annual plan · $3.33/mo</div>
      </div>
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 22px; font-weight: 600; color: #3B3335;">$39.99</div>
    </div>
    <div style="display: flex; justify-content: space-between; padding-top: 12px;">
      <div style="font-size: 13px; font-weight: 600; color: #3B3335;">Total due today</div>
      <div style="font-size: 13px; font-weight: 700; color: #3B3335;">$39.99</div>
    </div>
  </div>

  <!-- Divider -->
  <div style="margin: 24px 28px 0; border-top: 1px solid rgba(59,51,53,0.05);"></div>

  <!-- Payment method -->
  <div style="padding: 18px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px;">Payment Method</div>

    <!-- Card number -->
    <div style="margin-bottom: 14px;">
      <div style="font-size: 12px; font-weight: 600; color: #3B3335; margin-bottom: 6px;">Card number</div>
      <div style="display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff;">
        <div style="flex: 1; font-size: 14px; color: #B8ADB1;">4242 4242 4242 4242</div>
        <div style="display: flex; gap: 4px;">
          <div style="width: 28px; height: 18px; border-radius: 3px; background: #1A1F71; display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 8px; font-weight: 700; color: #fff; letter-spacing: -0.5px;">VISA</span>
          </div>
          <div style="width: 28px; height: 18px; border-radius: 3px; background: #EB001B; position: relative; display: flex; align-items: center; justify-content: center;">
            <div style="width: 10px; height: 10px; border-radius: 50%; background: #EB001B; position: absolute; left: 5px;"></div>
            <div style="width: 10px; height: 10px; border-radius: 50%; background: #F79E1B; position: absolute; right: 5px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Expiry + CVC -->
    <div style="display: flex; gap: 12px; margin-bottom: 14px;">
      <div style="flex: 1;">
        <div style="font-size: 12px; font-weight: 600; color: #3B3335; margin-bottom: 6px;">Expiry</div>
        <div style="padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff; font-size: 14px; color: #B8ADB1;">MM / YY</div>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 12px; font-weight: 600; color: #3B3335; margin-bottom: 6px;">CVC</div>
        <div style="padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff; font-size: 14px; color: #B8ADB1;">123</div>
      </div>
    </div>

    <!-- Name -->
    <div style="margin-bottom: 14px;">
      <div style="font-size: 12px; font-weight: 600; color: #3B3335; margin-bottom: 6px;">Name on card</div>
      <div style="padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff; font-size: 14px; color: #B8ADB1;">Full name</div>
    </div>
  </div>

  <!-- Security -->
  <div style="padding: 18px 28px 0; display: flex; align-items: center; gap: 8px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8EBE90" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <div style="font-size: 11px; color: #8A7E82;">Secured by Stripe · 256-bit SSL encryption</div>
  </div>

  <!-- CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 28px 38px; background: linear-gradient(transparent, #FAF8F5 20%);">
    <button style="width: 100%; background: #3B3335; border: none; border-radius: 14px; padding: 16px 0; color: #FAF8F5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FAF8F5" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Pay $39.99
    </button>
    <div style="text-align: center; margin-top: 10px; font-size: 11px; color: #B8ADB1;">Your subscription renews annually</div>
  </div>
</div>
</x-dc>
</body>
</html>
