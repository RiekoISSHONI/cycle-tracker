<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #FAF8F5; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF8F5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.10);">

  <!-- Status bar -->
  <div style="height: 56px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 15px; font-weight: 600; color: #3B3335;">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#3B3335"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13" y="3" width="3" height="9" rx="1" fill="#B8ADB1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#3B3335" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#3B3335"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#3B3335"/></svg>
    </div>
  </div>

  <!-- Skip -->
  <div style="padding: 4px 28px 0; display: flex; justify-content: flex-end;">
    <span style="font-size: 14px; color: #8A7E82; font-weight: 500; cursor: pointer;">スキップ</span>
  </div>

  <!-- Welcome hero -->
  <div style="padding: 32px 28px 0; text-align: center; position: relative;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 200px; font-weight: 800; color: rgba(212,137,122,0.04); position: absolute; top: -50px; left: 50%; transform: translateX(-50%); line-height: 1; pointer-events: none; user-select: none;">道</div>

    <div style="position: relative; z-index: 1;">
      <div style="width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(145deg, #D4897A, #B8705F); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(212,137,122,0.2);">
        <span style="font-family: 'Shippori Mincho B1', serif; font-size: 32px; font-weight: 800; color: #fff;">巡</span>
      </div>
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 26px; font-weight: 600; color: #3B3335;">Meguriへようこそ</div>
      <div style="font-size: 13px; color: #8A7E82; margin-top: 6px; line-height: 1.5;">周期トラッキングを設定しましょう。<br>約30秒で完了します。</div>
    </div>
  </div>

  <!-- Setup form -->
  <div style="padding: 32px 28px 0;">
    <!-- Last period -->
    <div style="margin-bottom: 24px;">
      <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px;">最後の生理開始日</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid rgba(59,51,53,0.08); cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C47E8E" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
        <div style="flex: 1; font-size: 15px; font-weight: 500; color: #3B3335;">2026年8月20日</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <!-- Cycle length -->
    <div style="margin-bottom: 24px;">
      <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px;">平均的な周期</div>
      <div style="display: flex; gap: 6px;">
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">24日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">26日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #3B3335; text-align: center; font-size: 14px; font-weight: 600; color: #FAF8F5; cursor: pointer;">28日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">30日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">32日</div>
      </div>
      <div style="text-align: center; margin-top: 8px; font-size: 11px; color: #B8ADB1;">わからない場合、28日が一般的な目安です</div>
    </div>

    <!-- Period length -->
    <div style="margin-bottom: 24px;">
      <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px;">平均的な生理期間</div>
      <div style="display: flex; gap: 6px;">
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">3日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">4日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #3B3335; text-align: center; font-size: 14px; font-weight: 600; color: #FAF8F5; cursor: pointer;">5日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">6日</div>
        <div style="flex: 1; padding: 12px 0; border-radius: 10px; background: #fff; border: 1px solid rgba(59,51,53,0.08); text-align: center; font-size: 14px; color: #8A7E82; cursor: pointer;">7日</div>
      </div>
    </div>

    <!-- Consent -->
    <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #E6F4E7; border: 1px solid rgba(142,190,144,0.15);">
      <div style="width: 20px; height: 20px; border-radius: 6px; background: #6A9E6C; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div style="font-size: 12px; color: #3B3335; line-height: 1.5;">この端末でヘルスデータの記録に同意します。すべてのデータはローカルに保存されます。<span style="color: #C47E8E; font-weight: 500; cursor: pointer;">プライバシーポリシー</span></div>
    </div>
  </div>

  <!-- Progress dots -->
  <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;">
    <div style="width: 8px; height: 8px; border-radius: 50%; background: #B8ADB1;"></div>
    <div style="width: 20px; height: 8px; border-radius: 4px; background: #3B3335;"></div>
    <div style="width: 8px; height: 8px; border-radius: 50%; background: #B8ADB1;"></div>
  </div>

  <!-- CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 28px 38px;">
    <button style="width: 100%; background: #3B3335; border: none; border-radius: 14px; padding: 16px 0; color: #FAF8F5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">トラッキングを開始</button>
  </div>
</div>
</x-dc>
</body>
</html>
