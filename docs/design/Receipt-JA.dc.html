<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #FAF8F5; }
    a { color: #C47E8E; } a:hover { color: #3B3335; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF8F5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.10);">

  <!-- Status bar -->
  <div style="height: 56px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 15px; font-weight: 600; color: #3B3335;">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#3B3335"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13" y="3" width="3" height="9" rx="1" fill="#B8ADB1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#3B3335" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#3B3335"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#3B3335"/></svg>
    </div>
  </div>

  <!-- Close -->
  <div style="padding: 4px 28px 0; display: flex; justify-content: flex-end;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A7E82" stroke-width="1.8" stroke-linecap="round" style="cursor: pointer;"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </div>

  <!-- Success hero -->
  <div style="padding: 40px 28px 0; text-align: center; position: relative;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 180px; font-weight: 800; color: rgba(142,190,144,0.04); position: absolute; top: -20px; left: 50%; transform: translateX(-50%); line-height: 1; pointer-events: none; user-select: none;">済</div>

    <div style="position: relative; z-index: 1;">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: #E6F4E7; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6A9E6C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 26px; font-weight: 600; color: #3B3335;">お支払い完了</div>
    </div>
  </div>

  <!-- Receipt card -->
  <div style="margin: 28px 28px 0; padding: 20px; border-radius: 16px; background: #fff; border: 1px solid rgba(59,51,53,0.06);">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; margin-bottom: 16px;">領収書</div>

    <!-- Item -->
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid rgba(59,51,53,0.05);">
      <div>
        <div style="font-size: 14px; font-weight: 600; color: #3B3335;">Meguri Premium</div>
        <div style="font-size: 12px; color: #8A7E82; margin-top: 2px;">年額プラン</div>
      </div>
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 20px; font-weight: 600; color: #3B3335;">¥5,800</div>
    </div>

    <!-- Details -->
    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 14px;">
      <div style="display: flex; justify-content: space-between;">
        <div style="font-size: 12px; color: #8A7E82;">日付</div>
        <div style="font-size: 12px; font-weight: 600; color: #3B3335;">2026年8月22日</div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <div style="font-size: 12px; color: #8A7E82;">お支払い方法</div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #3B3335;"><svg width="12" height="12" viewBox="0 0 24 24" fill="#3B3335"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C4.24 16.7 4.89 10.55 8.7 10.3c1.23.07 2.08.72 2.8.78.97-.2 1.9-.89 3.13-.8 1.32.1 2.33.62 2.99 1.57-2.77 1.67-2.12 5.33.58 6.35-.5 1.3-.9 2.03-1.15 2.08zM12.05 10.23c-.15-2.32 1.72-4.3 3.95-4.53.27 2.55-2.31 4.68-3.95 4.53z"/></svg> Apple ID</div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <div style="font-size: 12px; color: #8A7E82;">領収書番号</div>
        <div style="font-size: 12px; font-weight: 600; color: #3B3335; font-variant-numeric: tabular-nums;">MGR-20260822-0847</div>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <div style="font-size: 12px; color: #8A7E82;">次回更新日</div>
        <div style="font-size: 12px; font-weight: 600; color: #3B3335;">2027年8月22日</div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div style="padding: 20px 28px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid rgba(59,51,53,0.06); cursor: pointer;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #FCEAEF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C47E8E" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 13px; font-weight: 600; color: #3B3335;">メールで送信</div>
        <div style="font-size: 11px; color: #8A7E82; margin-top: 1px;">領収書のコピーをメールに送信</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid rgba(59,51,53,0.06); cursor: pointer;">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #FBF4DC; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8A45E" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 13px; font-weight: 600; color: #3B3335;">PDFをダウンロード</div>
        <div style="font-size: 11px; color: #8A7E82; margin-top: 1px;">領収書を保存する</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <!-- CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 28px 38px; background: linear-gradient(transparent, #FAF8F5 20%);">
    <button style="width: 100%; background: #3B3335; border: none; border-radius: 14px; padding: 16px 0; color: #FAF8F5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Premiumを使い始める</button>
    <div style="text-align: center; margin-top: 10px;">
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 12px; color: #D4897A;">巡 meguri</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
