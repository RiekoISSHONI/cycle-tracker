<!doctype html>
<html>

  <style>

  <div style="padding: 4px 28px 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">

  <!-- Title -->
  <div style="padding: 20px 28px 0; position: relative;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 180px; font-weight: 800; color: rgba(184,138,114,0.04); position: absolute; top: -40px; right: -20px; line-height: 1; pointer-events: none; user-select: none;">察</div>

  </div>

  <!-- Cycle length chart -->
  <div style="margin: 20px 28px 0; padding: 18px 20px; border-radius: 16px; background: #fff; border: 1px solid rgba(59,51,53,0.06);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;">Cycle Length</div>
      <div style="font-size: 11px; color: #8A7E82;">Last 6 cycles</div>
    </div>
    <!-- Simple bar chart -->
    <div style="display: flex; align-items: flex-end; gap: 8px; height: 80px; padding-bottom: 4px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 10px; font-weight: 600; color: #8A7E82; font-variant-numeric: tabular-nums;">29</div>
        <div style="width: 100%; height: 52px; border-radius: 6px 6px 2px 2px; background: rgba(212,168,144,0.25);"></div>

        <div style="font-size: 10px; font-weight: 600; color: #8A7E82; font-variant-numeric: tabular-nums;">27</div>
        <div style="width: 100%; height: 44px; border-radius: 6px 6px 2px 2px; background: rgba(212,168,144,0.25);"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 10px; font-weight: 600; color: #8A7E82; font-variant-numeric: tabular-nums;">28</div>
        <div style="width: 100%; height: 48px; border-radius: 6px 6px 2px 2px; background: rgba(212,168,144,0.25);"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 10px; font-weight: 600; color: #8A7E82; font-variant-numeric: tabular-nums;">30</div>
        <div style="width: 100%; height: 56px; border-radius: 6px 6px 2px 2px; background: rgba(212,168,144,0.25);"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 10px; font-weight: 600; color: #8A7E82; font-variant-numeric: tabular-nums;">28</div>
        <div style="width: 100%; height: 48px; border-radius: 6px 6px 2px 2px; background: rgba(212,168,144,0.25);"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 10px; font-weight: 600; color: #3B3335; font-variant-numeric: tabular-nums;">28</div>
        <div style="width: 100%; height: 48px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #D4897A, #B8705F);"></div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 6px;">
      <div style="font-size: 9px; color: #B8ADB1;">Mar</div>
      <div style="font-size: 9px; color: #B8ADB1;">Apr</div>
      <div style="font-size: 9px; color: #B8ADB1;">May</div>
      <div style="font-size: 9px; color: #B8ADB1;">Jun</div>
      <div style="font-size: 9px; color: #B8ADB1;">Jul</div>
      <div style="font-size: 9px; font-weight: 600; color: #3B3335;">Aug</div>
    </div>
  </div>

  <!-- Stats row -->

    <div style="flex: 1; padding: 16px; border-radius: 14px; background: #fff; border: 1px solid rgba(59,51,53,0.06); text-align: center;">

        <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(59,51,53,0.05); overflow: hidden;">
          <div style="width: 78%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #E4A0B0, #C47E8E);"></div>

        <div style="font-size: 12px; font-weight: 600; color: #8A7E82; width: 30px; text-align: right; font-variant-numeric: tabular-nums;">78%</div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335; width: 80px;">Fatigue</div>
        <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(59,51,53,0.05); overflow: hidden;">
          <div style="width: 65%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, rgba(184,164,94,0.5), #B8A45E);"></div>

        <div style="font-size: 12px; font-weight: 600; color: #8A7E82; width: 30px; text-align: right; font-variant-numeric: tabular-nums;">65%</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335; width: 80px;">Bloating</div>
        <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(59,51,53,0.05); overflow: hidden;">

        <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(59,51,53,0.05); overflow: hidden;">

        </div>
        <div style="font-size: 12px; font-weight: 600; color: #8A7E82; width: 30px; text-align: right; font-variant-numeric: tabular-nums;">35%</div>
      </div>
    </div>

  <!-- Mood pattern -->
  <div style="margin: 14px 28px 0; padding: 18px 20px; border-radius: 16px; background: #fff; border: 1px solid rgba(59,51,53,0.06);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
      <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;">Mood by Phase</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <div style="flex: 1; padding: 10px 8px; border-radius: 10px; background: #FCEAEF; text-align: center;">
        <div style="font-size: 18px; margin-bottom: 4px;">😌</div>
        <div style="font-family: 'Shippori Mincho B1', serif; font-size: 12px; font-weight: 600; color: #C47E8E;">静</div>
        <div style="font-size: 10px; color: #8A7E82; margin-top: 2px;">Low</div>
      </div>
      <div style="flex: 1; padding: 10px 8px; border-radius: 10px; background: #E6F4E7; text-align: center;">
        <div style="font-size: 18px; margin-bottom: 4px;">😊</div>
        <div style="font-family: 'Shippori Mincho B1', serif; font-size: 12px; font-weight: 600; color: #6A9E6C;">芽</div>
        <div style="font-size: 10px; color: #8A7E82; margin-top: 2px;">Good</div>
      </div>
      <div style="flex: 1; padding: 10px 8px; border-radius: 10px; background: #FBF4DC; text-align: center;">
        <div style="font-size: 18px; margin-bottom: 4px;">😄</div>
        <div style="font-family: 'Shippori Mincho B1', serif; font-size: 12px; font-weight: 600; color: #B8A45E;">輝</div>
        <div style="font-size: 10px; color: #8A7E82; margin-top: 2px;">Great</div>
