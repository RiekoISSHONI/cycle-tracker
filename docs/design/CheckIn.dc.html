<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #FAF8F5; }
    a { color: #C47E8E; } a:hover { color: #3B3335; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF8F5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.10);">

  <!-- Status bar -->
  <div style="height: 56px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 15px; font-weight: 600; color: #3B3335;">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#3B3335"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13" y="3" width="3" height="9" rx="1" fill="#B8ADB1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#3B3335" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#3B3335"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#3B3335"/></svg>
    </div>
  </div>

  <!-- Close / Back -->
  <div style="padding: 4px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A7E82" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    <div style="font-size: 13px; color: #8A7E82; font-weight: 500;">Day 3 · Stillness</div>
  </div>

  <!-- Title -->
  <div style="padding: 20px 28px 0; position: relative;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 180px; font-weight: 800; color: rgba(228,160,176,0.05); position: absolute; top: -40px; right: -20px; line-height: 1; pointer-events: none; user-select: none;">記</div>
    <div style="position: relative; z-index: 1;">
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 28px; font-weight: 600; color: #3B3335;">Check In</div>
    </div>
  </div>

  <!-- Period CTA -->
  <div style="margin: 22px 28px 0; padding: 16px 20px; border-radius: 14px; background: linear-gradient(135deg, #E4A0B0, #C47E8E); display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 60px; font-weight: 800; color: rgba(255,255,255,0.12); position: absolute; right: 10px; top: -8px; line-height: 1;">静</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>
    <div style="flex: 1; position: relative; z-index: 1;">
      <div style="font-size: 14px; font-weight: 700; color: #fff;">Log period start</div>
      <div style="font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px;">Tap to record</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </div>

  <!-- Mood -->
  <div style="padding: 24px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;">Mood</div>
    <div style="display: flex; gap: 0; border-radius: 12px; overflow: hidden; border: 1.5px solid rgba(59,51,53,0.08);">
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 500; color: #8A7E82; background: #fff;">😢<br>Low</div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 500; color: #8A7E82; background: #fff; border-left: 1px solid rgba(59,51,53,0.06);">😔<br>Down</div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 600; color: #3B3335; background: #FCEAEF; border-left: 1px solid rgba(59,51,53,0.06);">😌<br>Okay</div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 500; color: #8A7E82; background: #fff; border-left: 1px solid rgba(59,51,53,0.06);">😊<br>Good</div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 500; color: #8A7E82; background: #fff; border-left: 1px solid rgba(59,51,53,0.06);">😄<br>Great</div>
    </div>
  </div>

  <!-- Energy -->
  <div style="padding: 22px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;">Energy</div>
    <div style="display: flex; gap: 0; border-radius: 12px; overflow: hidden; border: 1.5px solid rgba(59,51,53,0.08);">
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 20px; color: #B8ADB1; background: #fff;">
        <div>⚡</div>
        <div style="font-size: 10px; margin-top: 2px; font-weight: 500;">1</div>
      </div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 20px; color: #3B3335; background: #FCEAEF; border-left: 1px solid rgba(59,51,53,0.06);">
        <div>⚡</div>
        <div style="font-size: 10px; margin-top: 2px; font-weight: 600;">2</div>
      </div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 20px; color: #B8ADB1; background: #fff; border-left: 1px solid rgba(59,51,53,0.06);">
        <div>⚡</div>
        <div style="font-size: 10px; margin-top: 2px; font-weight: 500;">3</div>
      </div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 20px; color: #B8ADB1; background: #fff; border-left: 1px solid rgba(59,51,53,0.06);">
        <div>⚡</div>
        <div style="font-size: 10px; margin-top: 2px; font-weight: 500;">4</div>
      </div>
      <div style="flex: 1; padding: 12px 0; text-align: center; font-size: 20px; color: #B8ADB1; background: #fff; border-left: 1px solid rgba(59,51,53,0.06);">
        <div>⚡</div>
        <div style="font-size: 10px; margin-top: 2px; font-weight: 500;">5</div>
      </div>
    </div>
  </div>

  <!-- Flow -->
  <div style="padding: 22px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;">Flow</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="padding: 8px 18px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 13px; font-weight: 500; color: #8A7E82;">None</div>
      <div style="padding: 8px 18px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 13px; font-weight: 500; color: #8A7E82;">Spotting</div>
      <div style="padding: 8px 18px; border-radius: 99px; background: #FCEAEF; border: 1.5px solid #E4A0B0; font-size: 13px; font-weight: 600; color: #C47E8E;">Light</div>
      <div style="padding: 8px 18px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 13px; font-weight: 500; color: #8A7E82;">Medium</div>
      <div style="padding: 8px 18px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 13px; font-weight: 500; color: #8A7E82;">Heavy</div>
    </div>
  </div>

  <!-- Symptoms -->
  <div style="padding: 22px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;">Symptoms</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <div style="padding: 8px 16px; border-radius: 99px; background: #FCEAEF; border: 1.5px solid #E4A0B0; font-size: 12px; font-weight: 600; color: #C47E8E;">Cramps</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 12px; font-weight: 500; color: #8A7E82;">Headache</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #FCEAEF; border: 1.5px solid #E4A0B0; font-size: 12px; font-weight: 600; color: #C47E8E;">Fatigue</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 12px; font-weight: 500; color: #8A7E82;">Bloating</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 12px; font-weight: 500; color: #8A7E82;">Back Pain</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 12px; font-weight: 500; color: #8A7E82;">Cravings</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 12px; font-weight: 500; color: #8A7E82;">Insomnia</div>
      <div style="padding: 8px 16px; border-radius: 99px; background: #fff; border: 1.5px solid rgba(59,51,53,0.08); font-size: 12px; font-weight: 500; color: #8A7E82;">Acne</div>
    </div>
  </div>

  <!-- Save button -->
  <div style="position: absolute; bottom: 68px; left: 28px; right: 28px;">
    <button style="width: 100%; background: #3B3335; border: none; border-radius: 14px; padding: 16px 0; color: #FAF8F5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: 0.3px;">Save Check-in</button>
  </div>

  <!-- Bottom spacer for button -->
  <div style="height: 120px;"></div>
</div>
</x-dc>
</body>
</html>
