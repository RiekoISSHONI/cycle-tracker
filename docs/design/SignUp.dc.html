<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #FAF8F5; }
    a { color: #C47E8E; } a:hover { color: #3B3335; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF8F5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.10);">

  <!-- Status bar -->
  <div style="height: 56px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 15px; font-weight: 600; color: #3B3335;">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#3B3335"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13" y="3" width="3" height="9" rx="1" fill="#B8ADB1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#3B3335" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#3B3335"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#3B3335"/></svg>
    </div>
  </div>

  <!-- Skip -->
  <div style="padding: 4px 28px 0; display: flex; justify-content: flex-end;">
    <span style="font-size: 14px; color: #8A7E82; font-weight: 500; cursor: pointer;">Use without account</span>
  </div>

  <!-- Hero -->
  <div style="padding: 36px 28px 0; text-align: center; position: relative;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 200px; font-weight: 800; color: rgba(212,137,122,0.04); position: absolute; top: -30px; left: 50%; transform: translateX(-50%); line-height: 1; pointer-events: none; user-select: none;">始</div>

    <div style="position: relative; z-index: 1;">
      <!-- Logo mark -->
      <div style="width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(145deg, #D4897A, #B8705F); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(212,137,122,0.25);">
        <span style="font-family: 'Shippori Mincho B1', serif; font-size: 28px; font-weight: 800; color: #fff;">巡</span>
      </div>
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 26px; font-weight: 600; color: #3B3335;">はじめましょう</div>
      <div style="font-size: 13px; color: #8A7E82; font-weight: 500; margin-top: 6px; line-height: 1.5;">Optional — only needed for premium features</div>
    </div>
  </div>

  <!-- Social sign-in -->
  <div style="padding: 28px 28px 0; display: flex; flex-direction: column; gap: 10px;">
    <!-- Apple -->
    <button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 0; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff; font-family: inherit; font-size: 14px; font-weight: 600; color: #3B3335; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#3B3335"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C4.24 16.7 4.89 10.55 8.7 10.3c1.23.07 2.08.72 2.8.78.97-.2 1.9-.89 3.13-.8 1.32.1 2.33.62 2.99 1.57-2.77 1.67-2.12 5.33.58 6.35-.5 1.3-.9 2.03-1.15 2.08zM12.05 10.23c-.15-2.32 1.72-4.3 3.95-4.53.27 2.55-2.31 4.68-3.95 4.53z"/></svg>
      Continue with Apple
    </button>
    <!-- Google -->
    <button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 0; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff; font-family: inherit; font-size: 14px; font-weight: 600; color: #3B3335; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.97 10.97 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- Divider -->
  <div style="display: flex; align-items: center; gap: 14px; padding: 22px 28px;">
    <div style="flex: 1; border-top: 1px solid rgba(59,51,53,0.08);"></div>
    <div style="font-size: 11px; color: #B8ADB1; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">Or</div>
    <div style="flex: 1; border-top: 1px solid rgba(59,51,53,0.08);"></div>
  </div>

  <!-- Email form -->
  <div style="padding: 0 28px;">
    <!-- Email -->
    <div style="margin-bottom: 12px;">
      <div style="font-size: 12px; font-weight: 600; color: #3B3335; margin-bottom: 6px;">Email</div>
      <div style="display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-right: 10px;"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4l-10 8L2 4"/></svg>
        <div style="font-size: 14px; color: #B8ADB1;">your@email.com</div>
      </div>
    </div>

    <!-- Password -->
    <div style="margin-bottom: 12px;">
      <div style="font-size: 12px; font-weight: 600; color: #3B3335; margin-bottom: 6px;">Password</div>
      <div style="display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1.5px solid rgba(59,51,53,0.10); background: #fff;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-right: 10px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <div style="flex: 1; font-size: 14px; color: #B8ADB1;">8+ characters</div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </div>
    </div>

    <!-- Sign up button -->
    <button style="width: 100%; background: #3B3335; border: none; border-radius: 14px; padding: 16px 0; color: #FAF8F5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;">Create account</button>
  </div>

  <!-- Terms -->
  <div style="padding: 16px 28px 0; text-align: center;">
    <div style="font-size: 11px; color: #B8ADB1; line-height: 1.6;">By continuing, you agree to our <span style="color: #C47E8E; text-decoration: underline; cursor: pointer;">Terms</span> and <span style="color: #C47E8E; text-decoration: underline; cursor: pointer;">Privacy Policy</span></div>
  </div>

  <!-- Footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 28px 38px; text-align: center;">
    <div style="font-size: 13px; color: #8A7E82;">Already have an account? <span style="color: #D4897A; font-weight: 600; cursor: pointer;">Sign in</span></div>
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 12px; color: #D4897A; margin-top: 10px;">巡 meguri</div>
  </div>
</div>
</x-dc>
</body>
</html>
