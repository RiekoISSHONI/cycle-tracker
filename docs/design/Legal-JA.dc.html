<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@400;500;600;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #FAF8F5; }
    a { color: #C47E8E; } a:hover { color: #3B3335; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF8F5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.10);">

  <!-- Status bar -->
  <div style="height: 56px; padding: 14px 28px 0; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 15px; font-weight: 600; color: #3B3335;">9:41</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#3B3335"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13" y="3" width="3" height="9" rx="1" fill="#B8ADB1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#3B3335" stroke-width="1"/><rect x="2" y="2" width="14" height="8" rx="2" fill="#3B3335"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#3B3335"/></svg>
    </div>
  </div>

  <!-- Back -->
  <div style="padding: 4px 28px 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A7E82" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span style="font-size: 14px; color: #8A7E82; font-weight: 500;">設定</span>
  </div>

  <!-- Title -->
  <div style="padding: 24px 28px 0; position: relative;">
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 180px; font-weight: 800; color: rgba(142,190,144,0.04); position: absolute; top: -40px; right: -20px; line-height: 1; pointer-events: none; user-select: none;">守</div>
    <div style="position: relative; z-index: 1;">
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 26px; font-weight: 600; color: #3B3335;">プライバシー</div>
    </div>
  </div>

  <!-- Tabs -->
  <div style="margin: 20px 28px 0; display: flex; gap: 2px; background: rgba(240,236,230,0.5); border-radius: 10px; padding: 3px;">
    <div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; background: #3B3335; font-size: 12px; font-weight: 600; color: #FAF8F5;">プライバシー</div>
    <div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 500; color: #8A7E82;">利用規約</div>
  </div>

  <!-- Privacy highlights -->
  <div style="padding: 22px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px;">私たちの約束</div>

    <!-- Highlight cards -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #E6F4E7; border: 1px solid rgba(142,190,144,0.15);">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A9E6C" stroke-width="2" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <div>
          <div style="font-size: 13px; font-weight: 700; color: #3B3335;">データはあなたの端末に保存</div>
          <div style="font-size: 11px; color: #6B6166; margin-top: 2px;">すべての周期データはブラウザにローカル保存されます</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #FBF4DC; border: 1px solid rgba(212,192,122,0.15);">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8A45E" stroke-width="2" stroke-linecap="round"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <div>
          <div style="font-size: 13px; font-weight: 700; color: #3B3335;">無料版はアカウント不要</div>
          <div style="font-size: 11px; color: #6B6166; margin-top: 2px;">登録は任意、プレミアムにのみ必要です</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #FCEAEF; border: 1px solid rgba(228,160,176,0.15);">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C47E8E" stroke-width="2" stroke-linecap="round"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><circle cx="12" cy="11" r="3"/></svg>
        </div>
        <div>
          <div style="font-size: 13px; font-weight: 700; color: #3B3335;">位置情報の追跡なし</div>
          <div style="font-size: 11px; color: #6B6166; margin-top: 2px;">位置情報へのアクセスや保存は一切行いません</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div style="margin: 0 28px; border-top: 1px solid rgba(59,51,53,0.05);"></div>

  <!-- Full policy sections -->
  <div style="padding: 18px 28px 0;">
    <div style="font-size: 10px; color: #B8ADB1; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px;">ポリシー全文</div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(59,51,53,0.05); cursor: pointer;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335;">データ収集</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(59,51,53,0.05); cursor: pointer;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335;">データ保存とセキュリティ</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(59,51,53,0.05); cursor: pointer;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335;">第三者サービス</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(59,51,53,0.05); cursor: pointer;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335;">アフィリエイトリンク</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(59,51,53,0.05); cursor: pointer;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335;">あなたの権利</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0; cursor: pointer;">
        <div style="font-size: 14px; font-weight: 500; color: #3B3335;">お問い合わせ</div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B8ADB1" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 28px 38px; text-align: center;">
    <div style="font-size: 11px; color: #B8ADB1;">最終更新: 2026年8月</div>
    <div style="font-family: 'Shippori Mincho B1', serif; font-size: 12px; color: #D4897A; margin-top: 4px;">巡 meguri</div>
  </div>
</div>
</x-dc>
</body>
</html>
